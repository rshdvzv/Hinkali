*{box-sizing:border-box}

function t(s,...a){
  let r = LANG==='az' ? (AZ[s] ?? s) : (RU_FIX[s] ?? s);
  if(LANG!=='az'&&s==='Выручка · {0}') r=r.replace('{E}',ending(+a[0]||0));
  return a.length?r.replace(/\{(\d)\}/g,(m,i)=>a[i]??''):r;
}
const tn=s=>t(s); // перевод названий из справочника (если совпадает со стандартным)

const S = {
  tab:'home', catalog:{products:[],ingredients:[],recipes:{}},
  ops:[], period:'today', from:'', to:'',

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const nf=(n,d=0)=>(+n||0).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>nf(n,2)+' ₼';
const sign=n=>(n>0?'+':n<0?'−':'')+nf(Math.abs(n),2)+' ₼';
const qf=n=>{n=+n||0;return Math.abs(n-Math.round(n))<1e-9?nf(Math.round(n)):nf(n,2)};
const r2=n=>Math.round((+n||0)*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const prod=id=>S.catalog.products.find(p=>p.id===id);
const ing=id=>S.catalog.ingredients.find(i=>i.id===id);
const pName=id=>prod(id)?tn(prod(id).name):t('(удалённый вид)');

// Количество с единицей: меньше 1 кг показываем в граммах, меньше 1 л — в мл.
const fq=(v,unit)=>{v=+v||0;const a=Math.abs(v);
  if(unit==='кг'&&a>0&&a<1) return nf(v*1000,Math.abs(v*1000)<10?1:0)+' '+t('г');
  if(unit==='л'&&a>0&&a<1) return nf(v*1000,Math.abs(v*1000)<10?1:0)+' '+t('мл');
  return qf(v)+' '+t(unit)};
const iq=(v,id)=>fq(v,ing(id)?.unit||'');

const small=u=>u==='кг'?'г':u==='л'?'мл':null;

const ending=n=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return 'ов';if(n1===1)return '';if(n1>=2&&n1<=4)return 'а';return 'ов'};

function periodRange(){
  const tt=today();
  if(S.period==='today') return [tt,tt];
  if(S.period==='yest'){const d=new Date();d.setDate(d.getDate()-1);const y=iso(d);return [y,y]}
  if(S.period==='week'){const d=new Date();d.setDate(d.getDate()-6);return [iso(d),tt]}
  if(S.period==='month') return [tt.slice(0,8)+'01',tt];
  if(S.period==='custom') return [S.from||'0000-01-01',S.to||'9999-12-31'];
  return ['0000-01-01','9999-12-31'];
}

/* ---------- calculations ---------- */
function calc(){
  const [a,b]=periodRange(); const inP=d=>d>=a&&d<=b;
  const C=S.catalog, rec=C.recipes||{};
  const bq={},ba={},avg={};
  for(const o of S.ops) if(o.type==='purchase'){bq[o.item]=(bq[o.item]||0)+ +o.qty;ba[o.item]=(ba[o.item]||0)+ +o.amount}
  for(const i of C.ingredients) avg[i.id]=bq[i.id]?ba[i.id]/bq[i.id]:(+i.price||0);
  const pc={};
  for(const p of C.products){let c=0;const r=rec[p.id]||{};for(const k in r)c+=(+r[k]||0)/100*(avg[k]||0);pc[p.id]=c}
  const P={},I={};
  const eP=id=>P[id]||(P[id]={made:0,ret:0,whs:0,waste:0,rev:0,stock:0,adj:0,touched:false});
  const eI=id=>I[id]||(I[id]={bought:0,spent:0,used:0,wasted:0,stock:0,adj:0,touched:false});
  C.products.forEach(p=>eP(p.id)); C.ingredients.forEach(i=>eI(i.id));
  const T={orders:0,ordersR:0,ordersW:0,rev:0,revR:0,revW:0,sold:0,soldR:0,soldW:0,made:0,waste:0,
    buy:0,exp:0,expCat:{},cogs:0,wasteCost:0,cashNow:0,debt:0,debts:[],ingShort:0,prodShort:0,counts:0};
  for(const o of S.ops){
    const p=inP(o.date), q=+o.qty||0;
    if(o.type==='purchase'){const x=eI(o.item);x.touched=true;x.stock+=q;T.cashNow-=+o.amount||0;if(p){x.bought+=q;x.spent+=+o.amount||0;T.buy+=+o.amount||0}}
    else if(o.type==='production'){const x=eP(o.item);x.touched=true;x.stock+=q;const r=rec[o.item]||{};
      for(const k in r){const u=(+r[k]||0)/100*q;const y=eI(k);y.stock-=u;if(p)y.used+=u}
      if(p){x.made+=q;T.made+=q}}
    else if(isOrder(o)){
      const amt=+o.amount||0, w=o.channel==='wholesale';
      if(orderPaid(o)) T.cashNow+=amt; else {T.debt+=amt;T.debts.push(o)}
      for(const l of orderLines(o)){const x=eP(l.item);x.stock-=+l.qty||0;
        if(p){const lq=+l.qty||0,la=lq*(+l.price||0);x.rev+=la;T.sold+=lq;T.cogs+=lq*(pc[l.item]||0);
          if(w){x.whs+=lq;T.soldW+=lq}else{x.ret+=lq;T.soldR+=lq}}}
      if(p){T.orders++;T.rev+=amt;if(w){T.ordersW++;T.revW+=amt}else{T.ordersR++;T.revR+=amt}}
    }
    else if(o.type==='waste'){
      if(o.kind==='ingredient'){const y=eI(o.item);y.stock-=q;if(p){y.wasted+=q;T.wasteCost+=q*(avg[o.item]||0)}}
      else{const x=eP(o.item);x.stock-=q;if(p){x.waste+=q;T.waste+=q;T.wasteCost+=q*(pc[o.item]||0)}}}
    else if(o.type==='adjust'){const d=+o.delta||0;
      if(o.kind==='ingredient'){const y=eI(o.item);y.stock+=d;y.touched=true;if(p&&o.reason==='count'){y.adj+=d;T.counts++;T.ingShort-=d*(avg[o.item]||0)}}
      else{const x=eP(o.item);x.stock+=d;x.touched=true;if(p&&o.reason==='count'){x.adj+=d;T.counts++;T.prodShort-=d*(pc[o.item]||0)}}}
    else if(o.type==='expense'){T.cashNow-=+o.amount||0;if(p){T.exp+=+o.amount||0;T.expCat[o.category]=(T.expCat[o.category]||0)+(+o.amount||0)}}
    else if(o.type==='cash'){const v=+o.amount||0;T.cashNow+=o.dir==='out'?-v:v}
  }
  let normCost=0; for(const i of C.ingredients) normCost+=(I[i.id].used||0)*(avg[i.id]||0);
  T.normPiece=T.made?normCost/T.made:0; T.factPiece=T.made?(normCost+T.ingShort)/T.made:0;
  T.result=T.rev-T.buy-T.exp;
  T.profitCost=T.rev-T.cogs-T.wasteCost-T.exp-T.ingShort-T.prodShort;
  return {P,I,T,pc,avg};
}
function lowList(I){
  const rec=S.catalog.recipes||{}, lim=+(S.catalog.lowPcs??200), out=[];
  if(!lim) return out;
  for(const i of S.catalog.ingredients){let per=0;for(const pid in rec){const v=+rec[pid]?.[i.id]||0;if(v>per)per=v}
    const x=I[i.id]; if(!per||!x||!x.touched) continue;
    const pcs=Math.max(0,Math.floor(x.stock/per*100)); if(pcs<lim) out.push([i,pcs])}
  return out;
}

}

/* ----- log ----- */
function vLog(){
  if(!S.ops.length) return `<div class="empty">${t('Записей пока нет. Нажмите «+ Записать».')}</div>`;
  const by={}; for(const o of S.ops)(by[o.date]=by[o.date]||[]).push(o);
  const L={order:'Заказ',sale:'Заказ',production:'Лепка',purchase:'Закупка',expense:'Расход',waste:'Мусор',cash:'Касса',adjust:'Склад'};
  let h='';
  for(const d of Object.keys(by).sort().reverse()){
    const day=by[d]; const rev=day.filter(isOrder).reduce((s,o)=>s+(+o.amount||0),0);
    h+=`<div class="day"><h3><span>${dLabel(d)}</span><span>${rev?t('выручка {0}',money(rev)):''}</span></h3>`;
    for(const o of day.sort((x,y)=>(y.ts||0)-(x.ts||0))){
      let name='',sub='',right='';
      if(isOrder(o)){const ls=orderLines(o);name=ls.map(l=>`${pName(l.item)} × ${nf(l.qty)}`).join(', ');
        sub=(o.channel==='wholesale'?t('Опт'):t('Штучно'))+(o.client?' · '+esc(o.client):'')+(orderPaid(o)?'':` · <b class="minus">${t('в долг')}</b>`);right=money(o.amount)}
      else if(o.type==='purchase'){name=iName(o.item);sub=`${iq(o.qty,o.item)} × ${money(o.price??o.amount/o.qty)}`;right='−'+money(o.amount)}
      else if(o.type==='production'){name=pName(o.item);right=nf(o.qty)+' '+t('шт')}
      else if(o.type==='expense'){name=t(o.category);sub=esc(o.note||'');right='−'+money(o.amount)}
      else if(o.type==='waste'){name=o.kind==='ingredient'?iName(o.item):pName(o.item);sub=esc(t(o.reason||''));right=o.kind==='ingredient'?iq(o.qty,o.item):qf(o.qty)+' '+t('шт')}
      else if(o.type==='adjust'){const ing=o.kind==='ingredient';name=ing?iName(o.item):pName(o.item);const u=ing?iUnit(o.item):t('шт');
        sub=o.reason==='opening'?t('Начальный остаток'):t('Пересчёт: было {0}, стало {1}',ing?iq((+o.counted||0)-(+o.delta||0),o.item):qf((+o.counted||0)-(+o.delta||0))+' '+u,ing?iq(o.counted,o.item):qf(o.counted)+' '+u);right=(o.delta>0?'+':'')+(ing?iq(o.delta,o.item):qf(o.delta)+' '+u)}
      else if(o.type==='cash'){name=o.dir==='out'?t('Забрали из кассы'):t('Положили в кассу');sub=esc(o.note||'');right=(o.dir==='out'?'−':'+')+money(o.amount)}
      const sure=S.confirmDel===o.id;
      h+=`<div class="op"><span class="t ${o.type==='sale'?'order':o.type}">${t(L[o.type]||o.type)}</span><div class="main"><div>${esc(name)}</div><div>${sub}</div></div><div class="r"><span>${right}</span><button class="x ${sure?'sure':''}" data-del="${o.id}">${sure?t('Точно удалить?'):t('удалить')}</button></div></div>`;
    }
    h+=`</div>`;
  }
  return h;
}

function perPiece(v,unit){
  if(!v) return '';
  if(unit==='кг'){const g=v*1000;return t('1 шт ≈ {0} г',g<10?nf(g,1):nf(g))}
  if(unit==='л'){const m=v*1000;return t('1 шт ≈ {0} мл',m<10?nf(m,1):nf(m))}
  return t('1 шт ≈ {0} {1}',nf(v,3),t(unit));
}
function refreshRecipe(){
  const box=$('#recCost'); if(!box) return;
  const N=Math.max(0,Math.round(+($('#calcN')?.value)||0)); if(N) S.calcN=N;
  const {avg,I}=calc(); let cost=0,miss=false,short=false,rows='';
  $$('[data-rec]').forEach(x=>{const v=+x.value||0;if(!v)return;const id=x.dataset.rec;const per100=x.dataset.w==='1'?v/10:v;const need=per100*N/100;const pr=avg[id]||0;if(!pr)miss=true;cost+=need*pr;
    const have=I[id]?.stock||0;const sh=need>have+1e-9;if(sh)short=true;
    rows+=`<tr><td>${esc(iName(id))}</td><td class="n"><b>${iq(need,id)}</b></td><td class="n">${sh?`<span class="pill bad">${iq(have,id)}</span>`:iq(have,id)}</td><td class="n">${money(need*pr)}</td></tr>`});
  if(!rows||!N){box.innerHTML='';return}
  const p=prod($('#recSel')?.value); const one=cost/N;
  let h=`<div class="tbl" style="margin-top:8px"><table><thead><tr><th>${t('Продукт')}</th><th>${t('Нужно')}</th><th>${t('На складе')}</th><th>${t('Стоит')}</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  if(short) h+=`<p class="note">${t('Красным — не хватает на складе.')}</p>`;
  h+=`<div class="preview" style="margin-top:10px"><div class="calc"><div class="cl"><span>${t('{0} шт обойдутся',nf(N))}</span><b>${money(cost)}</b></div><div class="cl"><span>${t('1 штука')}</span><b>${money(one)}</b></div>`;
  if(p){h+=`<div class="cl"><span>${t('Продадите штучно')}</span><b>${money(N*(+p.retail||0))}</b></div><div class="cs ${p.retail-one>=0?'plus':'minus'}">${t('заработок {0}',sign(N*((+p.retail||0)-one)))}</div>
    <div class="cl"><span>${t('Продадите оптом')}</span><b>${money(N*(+p.wholesale||0))}</b></div><div class="cs ${p.wholesale-one>=0?'plus':'minus'}">${t('заработок {0}',sign(N*((+p.wholesale||0)-one)))}</div>`}
  h+=`</div></div>`;
  if(miss) h+=`<p class="note">${t('У некоторых продуктов нет цены — впишите её выше, иначе расчёт неполный.')}</p>`;
  box.innerHTML=h;
}

5, "group": "Специи"}, {"id": "ihs", "name": "Хмели-сунели", "unit": "кг", "price": 18, "group": "Специи"}, {"id": "ioil", "name": "Масло растительное", "unit": "л", "price": 3.5, "group": "Прочее"}, {"id": "ibag", "name": "Пакеты для заморозки", "unit": "шт", "price": 0.05, "group": "Упаковка"}, {"id": "ibox", "name": "Лотки / контейнеры", "unit": "шт", "price": 0.25, "group": "Упаковка"}, {"id": "igl", "name": "Перчатки", "unit": "уп", "price": 4, "group": "Упаковка"}], "recipes": {"pb": {"if": 3.5, "ib": 4, "io": 1, "igr": 0.05, "ik": 3, "isa": 0.1, "ibp": 0.02, "izi": 0.02}, "pl": {"if": 3.5, "il": 4, "io": 1, "ik": 3, "isa": 0.1, "ibp": 0.02, "izi": 0.03, "ich": 0.01}, "pmx": {"if": 3.5, "ib": 2, "il": 2, "io": 1, "igr": 0.05, "ik": 3, "isa": 0.1, "ibp": 0.02, "izi": 0.02, "ihs": 0.01}, "pc": {"if": 3.5, "is": 2, "ii": 2, "ibt": 0.3, "isa": 0.03}, "pg": {"if": 3.5, "im": 4, "io": 1, "ioil": 0.2, "ik": 2, "isa": 0.08, "ibp": 0.02}, "ppt": {"if": 3.5, "ipt": 4, "io": 0.8, "ibt": 0.3, "isa": 0.08, "ibp": 0.02}}};
let storageOk=true;
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({v:1,catalog:S.catalog,ops:S.ops,lastBackup:S.lastBackup||null}));storageOk=true}
  catch(e){storageOk=false;toast(t('Память телефона не сохранила данные. Сделайте резервную копию.'))}
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);S.catalog=d.catalog||JSON.parse(JSON.stringify(DEFAULT_CATALOG));S.ops=Array.isArray(d.ops)?d.ops:[];S.lastBackup=d.lastBackup||null;
    let fix=false;for(const i of S.catalog.ingredients||[]){if(i.group==='Мясо'&&i.unit==='л'){i.unit='кг';fix=true}}if(fix)persist();return}}
  catch(e){storageOk=false}
  S.catalog=JSON.parse(JSON.stringify(DEFAULT_CATALOG));S.ops=[];
}
function saveCatalog(C,silent){S.catalog=C;persist();if(!silent){toast(t('Настройки сохранены'));render()}return true}
function addOps(list){const base=Date.now();list.forEach((o,k)=>{o.id=o.id||uid();o.ts=base+k;S.ops.push(o)});persist();return true}
function delOp(id){S.ops=S.ops.filter(o=>o.id!==id);persist()}
function markPaid(id){const o=S.ops.find(x=>x.id===id);if(!o)return;o.paid=true;o.paidDate=today();persist();toast(t('Оплата записана — деньги в кассе'))}
function setLang(l){LANG=l;try{localStorage.setItem(LANG_KEY,l)}catch(_){}render()}

/* ---------- резервная копия ---------- */
async function makeBackup(){
  const data=JSON.stringify({app:'khinkali',v:1,saved:new Date().toISOString(),catalog:S.catalog,ops:S.ops},null,1);
  const name='hinkali-'+today()+'.json';
  const file=new File([data],name,{type:'application/json'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:t('Резервная копия')})}
    else{const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
    S.lastBackup=today();persist();toast(t('Копия сохранена'));render();
  }catch(e){if(e&&e.name==='AbortError')return;toast(t('Не получилось сохранить копию'))}
}
function restoreBackup(file){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='khinkali'||!Array.isArray(d.ops))throw 0;S.pendingRestore=d;render()}catch(e){toast(t('Это не файл копии учёта хинкали'))}};
  r.readAsText(file);
}

/* ---------- events ---------- */
$('#reloadBtn').addEventListener('click',()=>location.reload());
$('#langBtn').addEventListener('click',()=>{if(S.tab==='cat')S.catalog=readCatDom();setLang(LANG==='az'?'ru':'az')});
$('nav.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;
  if(S.tab==='cat'&&b.dataset.tab!=='cat') S.catalog=readCatDom();
  S.tab=b.dataset.tab;S.confirmDel=null;render();window.scrollTo(0,0)});

view.addEventListener('click',e=>{
  const hd=e.target.closest('[data-buyon]');
  if(hd){const id=hd.dataset.buyon;if(S.buy[id])delete S.buy[id];else S.buy[id]={qty:'',price:ing(id)?.price??''};render();setTimeout(()=>$(`[data-bqty="${id}"]`)?.focus(),0);return}
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.ut){S.ut[d.ut]=!S.ut[d.ut];b.textContent=t(S.ut[d.ut]?small(d.u):d.u);return S.tab==='add'?refreshTotals():undefined}
  if('quick' in d){S.quick=d.quick||null;render();if(S.quick)setTimeout(()=>$('#qAmt')?.focus(),0);return}
  if(d.lang){S.catalog=readCatDom();return setLang(d.lang)}
  if(d.period){S.period=d.period;return render()}
  if(d.go){S.type=d.go;S.tab='add';render();window.scrollTo(0,0);return}
  if(d.ftype){S.type=d.ftype;return render()}
  if(d.chan){if(S.channel!==d.chan){S.channel=d.chan;for(const k in S.lines)delete S.lines[k].price}return render()}
  if(d.paidsel){S.paid=d.paidsel==='1';return render()}
  if(d.wkind){S.wkind=d.wkind;S.wItem=null;return render()}
  if(d.cdir){S.cashDir=d.cdir;return render()}
  if(d.step){const id=d.step;const l=S.lines[id]||(S.lines[id]={});l.qty=Math.max(0,(+l.qty||0)+ +d.d);const inp=$(`[data-lqty="${id}"]`);if(inp)inp.value=l.qty||'';return refreshTotals()}
  if(d.mstep){const id=d.mstep;S.make[id]=Math.max(0,(+S.make[id]||0)+ +d.d);const inp=$(`[data-mqty="${id}"]`);if(inp)inp.value=S.make[id]||'';return refreshTotals()}
  if(d.del){if(S.confirmDel!==d.del){S.confirmDel=d.del;return render()}S.confirmDel=null;delOp(d.del);toast(t('Запись удалена'));return render()}
  if(d.paid){markPaid(d.paid);return render()}
  if(d.rmp){const C=readCatDom();C.products=C.products.filter(p=>p.id!==d.rmp);S.catalog=C;return render()}
  if(d.rmi){const C=readCatDom();C.ingredients=C.ingredients.filter(p=>p.id!==d.rmi);S.catalog=C;return render()}
  const a=d.act;
  if(a==='addP'){const C=readCatDom();C.products.push({id:'p'+uid(),name:t('Новый вид'),retail:1,wholesale:0.7});S.catalog=C;return render()}
  if(a==='addI'){const C=readCatDom();C.ingredients.push({id:'i'+uid(),name:t('Новый продукт'),unit:'кг',price:null,group:'Прочее'});S.catalog=C;return render()}
  if(a==='saveCat') return saveCatalog(readCatDom());
  if(a==='backup') return makeBackup();
  if(a==='doRestore'){const dd=S.pendingRestore;S.pendingRestore=null;S.catalog=dd.catalog||S.catalog;S.ops=dd.ops;persist();toast(t('Данные восстановлены'));return render()}
  if(a==='noRestore'){S.pendingRestore=null;return render()}
  if(a==='reload') return location.reload();
  if(a==='askResetOps'){S.confirmReset='ops';return render()}
  if(a==='askResetAll'){S.confirmReset='all';return render()}
  if(a==='noReset'){S.confirmReset=null;return render()}
  if(a==='resetOps'){S.confirmReset=null;S.ops=[];persist();toast(t('Все записи стёрты'));S.tab='home';return render()}
  if(a==='resetAll'){S.confirmReset=null;S.ops=[];S.lastBackup=null;S.catalog=JSON.parse(JSON.stringify(DEFAULT_CATALOG));persist();toast(t('Программа сброшена'));S.tab='home';return render()}
});

view.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.lqty){(S.lines[d.lqty]=S.lines[d.lqty]||{}).qty=e.target.value;return refreshTotals()}
  if(d.lprice){(S.lines[d.lprice]=S.lines[d.lprice]||{}).price=e.target.value===''?0:+e.target.value;return refreshTotals()}
  if(d.mqty){S.make[d.mqty]=e.target.value;return refreshTotals()}
  if(d.bqty){S.buy[d.bqty].qty=e.target.value;return refreshTotals()}
  if(d.bprice){S.buy[d.bprice].price=e.target.value;return refreshTotals()}
  if(d.rec||e.target.id==='calcN') return refreshRecipe();
  if(d.cnt){const n=$$('[data-cnt]').filter(x=>x.value!=='').length;$('#cntN').textContent=n;$('#cntGo').disabled=!n;return}
  if(e.target.id==='fClient') S.client=e.target.value;
});
view.addEventListener('change',e=>{
  if(e.target.id==='recSel'){S.catalog=readCatDom();S.recProd=e.target.value;return render()}
  if(e.target.id==='recBatch'){const nb=Math.max(1,Math.round(+e.target.value||100));S.catalog=readCatDom();S.recBatch=nb;return render()}
  if(e.target.id==='pFrom'){S.from=e.target.value;return render()}
  if(e.target.id==='pTo'){S.to=e.target.value;return render()}
  if(e.target.id==='fDate') S.date=e.target.value;
  if(e.target.id==='fItem'&&S.type==='waste'){S.wItem=e.target.value;if(S.wkind==='ingredient'){const q=$('#fQty').value;render();$('#fQty').value=q}}
  if(e.target.id==='restoreFile'&&e.target.files[0]) restoreBackup(e.target.files[0]);
});

view.addEventListener('submit',e=>{
  e.preventDefault(); if(S.busy) return;
  if(e.target.id==='quickForm'){
    const amt=+$('#qAmt').value;if(!(amt>0))return toast(t('Укажите сумму'));
    addOps([{type:'cash',date:today(),dir:S.quick,amount:r2(amt),note:$('#qNote').value.trim()}]);
    toast(S.quick==='out'?t('Деньги забраны из кассы'):t('Деньги в кассе'));S.quick=null;return render();
  }
  if(e.target.id==='countForm'){
    const {P,I}=calc(); const list=[];
    $$('[data-cnt]').forEach(x=>{if(x.value==='')return;const [k,id]=x.dataset.cnt.split(':');const actual=+(k==='i'?conv('c:'+id,+x.value):+x.value).toFixed(5);if(!(actual>=0))return;
      const cur=k==='p'?P[id]:I[id]; if(!cur) return; const delta=+(actual-cur.stock).toFixed(4); if(Math.abs(delta)<1e-9) return;
      list.push({type:'adjust',date:today(),kind:k==='p'?'product':'ingredient',item:id,delta,counted:actual,reason:cur.touched?'count':'opening'})});
    if(!list.length){toast(t('Ничего не изменилось'));return render()}
    addOps(list);toast(t('Склад обновлён'));return render();
  }
  const date=$('#fDate').value||today(); S.date=date===today()?'':date;
  let list=[], msg='';
  if(S.type==='order'){
    const lines=[];for(const p of S.catalog.products){const l=S.lines[p.id];const q=+l?.qty||0;if(q>0)lines.push({item:p.id,qty:q,price:+(l.price??(S.channel==='wholesale'?p.wholesale:p.retail))||0})}
    if(!lines.length) return toast(t('Добавьте хотя бы одну позицию'));
    const amount=r2(lines.reduce((s,l)=>s+l.qty*l.price,0));
    const o={type:'order',date,channel:S.channel,lines,amount,paid:S.paid};const c=$('#fClient').value.trim();if(c)o.client=c;
    if(!S.paid&&!c) return toast(t('Для долга укажите клиента'));
    list=[o];msg=t('Заказ записан: {0}',money(amount));
  } else if(S.type==='production'){
    for(const p of S.catalog.products){const q=+S.make[p.id]||0;if(q>0)list.push({type:'production',date,item:p.id,qty:q})}
    if(!list.length) return toast(t('Укажите количество'));
    msg=t('Слеплено {0} шт',nf(list.reduce((s,o)=>s+o.qty,0)));
  } else if(S.type==='purchase'){
    const trip=uid();
    for(const id in S.buy){const b=S.buy[id];const q=+conv('b:'+id,+b.qty||0).toFixed(5);if(q<=0)continue;const pr=+b.price||0;list.push({type:'purchase',date,item:id,qty:q,price:pr,amount:r2(q*pr),trip})}
    if(!list.length) return toast(t('Укажите, сколько купили'));
    msg=t('Закупка записана: {0}',money(list.reduce((s,o)=>s+o.amount,0)));
  } else if(S.type==='expense'){
    const amt=+$('#fAmt').value;if(!(amt>0))return toast(t('Укажите сумму'));
    list=[{type:'expense',date,category:$('#fCat').value,amount:r2(amt),note:$('#fNote').value.trim()}];msg=t('Расход записан');
  } else if(S.type==='waste'){
    const q=+(S.wkind==='ingredient'?conv('w',+$('#fQty').value):+$('#fQty').value).toFixed(5);if(!(q>0))return toast(t('Укажите количество'));
    list=[{type:'waste',date,kind:S.wkind,item:$('#fItem').value,qty:q,reason:$('#fReason').value}];msg=t('Записано в убыток');
  } else {
    const amt=+$('#fAmt').value;if(!(amt>0))return toast(t('Укажите сумму'));
    list=[{type:'cash',date,dir:S.cashDir,amount:r2(amt),note:$('#fNote').value.trim()}];msg=S.cashDir==='out'?t('Деньги забраны из кассы'):t('Деньги в кассе');
  }
  S.busy=true;
  addOps(list);
  if(S.type==='purchase'){const C=JSON.parse(JSON.stringify(S.catalog));let ch=false;
    for(const o of list){const i=C.ingredients.find(x=>x.id===o.item);if(i&&o.price&&i.price!==o.price){i.price=o.price;ch=true}}
    if(ch) saveCatalog(C,true);}
  S.busy=false;
  S.lines={};S.make={};S.buy={};S.client='';S.paid=true;toast(msg);render();
});

/* ---------- boot ---------- */
load();
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}
})();
</script>
